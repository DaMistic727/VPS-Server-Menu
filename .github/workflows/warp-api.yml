name: WARP API regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck python3
      - name: Bash syntax
        run: bash -n install.sh uninstall.sh server-menu menu_warp.sh warp_watchdog.sh tests/test_warp_watchdog.sh
      - name: ShellCheck (known legacy diagnostics excluded)
        run: shellcheck -e SC1091,SC2162,SC2086,SC2155,SC2034 install.sh uninstall.sh server-menu menu_warp.sh warp_watchdog.sh tests/test_warp_watchdog.sh
      - name: Offline regression
        run: |
          bash tests/test_warp_endpoints.sh
          bash tests/test_noninteractive_install.sh
          bash tests/test_warp_watchdog.sh
          git diff --check
